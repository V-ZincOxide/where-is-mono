<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Room Status</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden; 
    }
    
    #main-screen {
      width: 100%;
      height: 100%;
      cursor: default;
    }
    
    /* === 上部：名前プレートセクション === */
    #nameplate-section {
      display: table;
      width: 100%;
      height: 180px; /* vwをやめてpxで高さを固定 */
      border-bottom: 4px solid #000000;
      box-sizing: border-box;
    }
    
    .nameplate-inner {
      display: table-cell;
      vertical-align: middle;
      text-align: center;
    }

    .korean-name {
      display: inline-block;
      vertical-align: middle;
      font-size: 64px; /* pxで巨大に指定 */
      font-weight: bold;
      line-height: 1;
      margin-right: 20px;
    }

    .ja-en-name {
      display: inline-block;
      vertical-align: middle;
      text-align: left; 
      font-size: 28px; /* pxで中くらいに指定 */
      line-height: 1.2;
      color: #333333; 
    }

    /* === 下部：ステータス表示セクション === */
    #status-section {
      display: table;
      width: 100%;
      height: 400px; /* ここもpxで高さを確保 */
    }
    
    .status-text-wrapper {
      display: table-cell;
      vertical-align: middle;
      text-align: center;
    }
    
    .status-text {
      font-size: 110px; /* ステータス文字を最大に */
      font-weight: bold;
      line-height: 1.1;
    }

    /* === リスト・メニュー画面 === */
    #list-screen {
      display: none;
      position: absolute; 
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background-color: #ffffff;
      z-index: 1000;
    }
    .list-item {
      font-size: 50px; /* リストもpx指定 */
      font-weight: bold;
      padding: 40px 0;
      text-align: center;
      border-bottom: 2px solid #000000;
      cursor: pointer;
    }

    .reset-btn {
      font-size: 30px;
      font-weight: bold;
      text-align: center;
      padding: 30px 0;
      margin-top: 40px; 
      border-top: 4px solid #000000;
      background-color: #e0e0e0;
      cursor: pointer;
    }

    .secret-zone {
      position: absolute;
      width: 25%;
      height: 25%;
      z-index: 999;
      background-color: transparent;
    }
  </style>
</head>
<body>

  <div class="secret-zone" style="top:0; left:0;" onclick="secretTap(1);"></div>
  <div class="secret-zone" style="top:0; right:0;" onclick="secretTap(2);"></div>
  <div class="secret-zone" style="bottom:0; left:0;" onclick="secretTap(3);"></div>
  <div class="secret-zone" style="bottom:0; right:0;" onclick="secretTap(4);"></div>

  <div id="main-screen">
    <div id="nameplate-section">
      <div class="nameplate-inner">
        <div class="korean-name">모노</div>
        <div class="ja-en-name">
          <div>モノ</div>
          <div>Mono</div>
        </div>
      </div>
    </div>

    <div id="status-section">
      <div class="status-text-wrapper">
        <div id="status-display" class="status-text">読込中...</div>
      </div>
    </div>
  </div>

  <div id="list-screen">
    <div id="list-container"></div>
    <div class="reset-btn" onclick="resetPassword()">パスワードをリセットして初期化</div>
  </div>

  <script>
    var statuses = [
      "재실\n在室\nIn room",
      "외출중\n外出中\nAway",
      "짐승합격중\n獣化中\nFursuiting",
      "휴식중\n休憩中\nResting"
    ];
    var currentIndex = parseInt(localStorage.getItem('room_status_index')) || 0;
    if (currentIndex >= statuses.length) currentIndex = 0;

    var mainScreen = document.getElementById('main-screen');
    var listScreen = document.getElementById('list-screen');
    var displayEl = document.getElementById('status-display');
    var listContainer = document.getElementById('list-container');

    var adminPassword = localStorage.getItem('room_status_admin_pw');
    if (!adminPassword) {
      adminPassword = prompt("【初回設定】\n更新用のパスワードを入力してください。") || '0000';
      localStorage.setItem('room_status_admin_pw', adminPassword);
    }

    function checkAuthAndShowList() {
      if (prompt("パスワードを入力してください") === localStorage.getItem('room_status_admin_pw')) {
        mainScreen.style.display = 'none';
        listScreen.style.display = 'block'; 
      } else {
        alert("不一致");
      }
    }

    var secretSequence = [];
    function secretTap(zoneNum) {
      secretSequence.push(zoneNum);
      if (secretSequence.length > 4) secretSequence.shift();
      if (secretSequence.join('') === '1234') {
        secretSequence = [];
        checkAuthAndShowList();
      }
    }

    function resetPassword() {
      if (confirm("リセットしますか？")) {
        localStorage.removeItem('room_status_admin_pw');
        location.reload();
      }
    }

    function updateDisplay() {
      displayEl.innerHTML = statuses[currentIndex].replace(/\n/g, '<br>');
    }

    function selectStatus(index) {
      currentIndex = index;
      localStorage.setItem('room_status_index', index);
      updateDisplay();
      listScreen.style.display = 'none';
      mainScreen.style.display = 'block';
    }

    var listHtml = "";
    for (var i = 0; i < statuses.length; i++) {
      listHtml += '<div class="list-item" onclick="selectStatus(' + i + ')">' + statuses[i].replace(/\n/g, ' ') + '</div>';
    }
    listContainer.innerHTML = listHtml;

    updateDisplay();
  </script>
</body>
</html>
