<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Room Status</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden; 
    }
    
    #main-screen {
      width: 100%;
      height: 100%;
      cursor: default;
    }
    
    /* === 上部：名前プレートセクション（テーブルレイアウトに変更） === */
    #nameplate-section {
      width: 100%;
      height: 25vh;
      border-bottom: 4px solid #000000;
      box-sizing: border-box;
      text-align: center; /* 中のテーブルを中央寄せ */
      padding: 3vh 0;
    }

    /* 名前全体を囲む仮想テーブル */
    .name-wrapper {
      display: inline-table;
      height: 100%;
    }

    /* 韓国語名前（テーブルの左セル） */
    .korean-name {
      display: table-cell;
      vertical-align: middle;
      font-size: 15vw;
      font-weight: bold;
      padding-right: 4vw; /* 日本語・英語との隙間 */
    }

    /* 日・英名前（テーブルの右セル） */
    .ja-en-name {
      display: table-cell;
      vertical-align: middle;
      text-align: left; 
      font-size: 7vw; 
    }

    /* === 下部：ステータス表示セクション（テーブルレイアウトに変更） === */
    #status-section {
      width: 100%;
      height: 75vh; /* 残りの75% */
      display: table;
    }
    .status-text-wrapper {
      display: table-cell;
      vertical-align: middle;
      text-align: center;
    }
    .status-text {
      font-size: 16vw; 
      font-weight: bold;
      line-height: 1.2;
    }

    /* メニュー画面 */
    #list-screen {
      display: none;
      position: absolute; 
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background-color: #ffffff;
      z-index: 1000;
    }
    .list-item {
      font-size: 8vw;
      font-weight: bold;
      padding: 5vh 0;
      text-align: center;
      border-bottom: 2px solid #000000;
      cursor: pointer;
    }

    .reset-btn {
      font-size: 5vw;
      font-weight: bold;
      text-align: center;
      padding: 4vh 0;
      margin-top: 5vh; 
      border-top: 4px solid #000000;
      background-color: #e0e0e0;
      cursor: pointer;
    }

    .secret-zone {
      position: absolute;
      width: 25vw;
      height: 25vh;
      z-index: 999;
      background-color: transparent;
    }
  </style>
</head>
<body>

  <div class="secret-zone" style="top:0; left:0;" onclick="secretTap(1);"></div>
  <div class="secret-zone" style="top:0; right:0;" onclick="secretTap(2);"></div>
  <div class="secret-zone" style="bottom:0; left:0;" onclick="secretTap(3);"></div>
  <div class="secret-zone" style="bottom:0; right:0;" onclick="secretTap(4);"></div>

  <div id="main-screen">
    
    <div id="nameplate-section">
      <div class="name-wrapper">
        <div class="korean-name">징크 옥사이드</div>
        <div class="ja-en-name">
          <div>ジンク・オクサイド</div>
          <div>Zinc Oxide</div>
        </div>
      </div>
    </div>

    <div id="status-section">
      <div class="status-text-wrapper">
        <div id="status-display" class="status-text">読込中...</div>
      </div>
    </div>

  </div>

  <div id="list-screen">
    <div id="list-container"></div>
    <div class="reset-btn" onclick="resetPassword()">パスワードをリセットして初期化</div>
  </div>

  <script>
    var statuses = [
      "재실\n在室\nIn room",
      "외출중\n外出中\nAway",
      "짐승합격중\n獣化中\nFursuiting",
      "휴식중\n休憩中\nResting"
    ];
    
    var currentIndex = 0;
    var savedIndex = localStorage.getItem('room_status_index');
    if (savedIndex !== null) {
      currentIndex = parseInt(savedIndex, 10);
      if (currentIndex >= statuses.length) currentIndex = 0;
    }

    var mainScreen = document.getElementById('main-screen');
    var listScreen = document.getElementById('list-screen');
    var displayEl = document.getElementById('status-display');
    var listContainer = document.getElementById('list-container');

    var adminPassword = localStorage.getItem('room_status_admin_pw');
    
    if (!adminPassword) {
      adminPassword = prompt("【初回設定】\n更新用のパスワードを新しく決めて入力してください。");
      if (adminPassword) {
        localStorage.setItem('room_status_admin_pw', adminPassword);
        alert("パスワードを設定しました。");
      } else {
        localStorage.setItem('room_status_admin_pw', '0000');
        alert("パスワードが空のため、仮パスワード「0000」を設定しました。");
      }
    }

    function checkAuthAndShowList() {
      var input = prompt("パスワードを入力してください");
      var savedPassword = localStorage.getItem('room_status_admin_pw');
      
      if (input === savedPassword) {
        mainScreen.style.display = 'none';
        listScreen.style.display = 'block'; 
      } else if (input !== null) {
        alert("パスワードが違います。");
      }
    }

    var secretSequence = [];
    function secretTap(zoneNum) {
      secretSequence.push(zoneNum);
      
      if (secretSequence.length > 4) {
        secretSequence.shift();
      }
      
      if (secretSequence.join(',') === '1,2,3,4') {
        secretSequence = [];
        checkAuthAndShowList();
      }
    }

    function resetPassword() {
      if (confirm("パスワードをリセットして、ページを再読み込みしますか？")) {
        localStorage.removeItem('room_status_admin_pw');
        location.reload();
      }
    }

    function updateDisplay() {
      var text = statuses[currentIndex];
      displayEl.innerHTML = text.replace(/\n/g, '<br>');
    }

    function hideList() {
      listScreen.style.display = 'none';
      mainScreen.style.display = 'block';
    }

    function selectStatus(index) {
      currentIndex = index;
      localStorage.setItem('room_status_index', currentIndex);
      updateDisplay();
      hideList();
    }

    var listHtml = "";
    for (var i = 0; i < statuses.length; i++) {
      var displayText = statuses[i].replace(/\n/g, ' ');
      listHtml += '<div class="list-item" onclick="selectStatus(' + i + ')">' + displayText + '</div>';
    }
    listContainer.innerHTML = listHtml;

    updateDisplay();
  </script>
</body>
</html>
